name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.21"

      - name: Instalar Python 3.12
        run: uv python install 3.12

      - name: Criar ambiente e instalar dependências
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: ruff format --check
        run: .venv/bin/ruff format --check .

      - name: ruff check
        run: .venv/bin/ruff check .

      - name: Gate de migração (upgrade / downgrade / upgrade)
        env:
          SQLITE_DATABASE_PATH: /tmp/helpdesk-ci-migration.db
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head

      - name: pytest (com cobertura)
        run: .venv/bin/pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes (com cobertura)
        run: npm run test -- --run

      - name: Build de produção
        run: npm run build
