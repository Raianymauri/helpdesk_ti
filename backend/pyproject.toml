[project]
name = "helpdesk-backend"
version = "0.1.0"
description = "API do helpdesk interno de TI."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "coverage==7.15.4",
    "httpx2==2.12.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80 --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]
